// Camera and view control variables
let rotX = 0;
let rotY = 0;
let zoomLevel = 120;
let prevMouseX, prevMouseY;
let isDragging = false;

// Panning variables
let panX = 0;
let panY = 0;
let isPanning = false;

// Inertia-related variables
let rotVelX = 0;
let rotVelY = 0;
let damping = 0.95; // Damping factor (0-1), closer to 1 means less damping
let inertiaThreshold = 0.1; // Stop rotation when velocity falls below this threshold

// Spacing between elements
let spacing = 80;

// Color variables - all configurable
let bgColor = [0, 0, 0]; // Background
let sphereColor = [255, 255, 255]; // Spheres
let textColor = [255, 255, 255]; // Text
let textShadowColor = [255, 255, 255, 80]; // Text shadow
let lineColor = [255, 255, 255, 80]; // Lines
let xAxisColor = [255, 0, 0]; // X axis
let yAxisColor = [0, 255, 0]; // Y axis
let zAxisColor = [0, 0, 255]; // Z axis

// Node size settings
let minNodeSize = 1;
let maxNodeSize = 4;

// Font variable
let myFont;

// Preload function to load the font
function preload() {
  // Load a default font that comes with p5.js
  myFont = loadFont('https://cdnjs.cloudflare.com/ajax/libs/topcoat/0.8.0/font/SourceCodePro-Bold.otf');
}

function setup() {
  createCanvas(windowWidth, windowHeight, WEBGL);
  
  // Set the font
  textFont(myFont);
  
  // Enable smooth rotation
  angleMode(DEGREES);
  
  // Set text properties
  textAlign(CENTER, CENTER);
  textSize(8);
  
  // Add UI instructions
  let instructions = createDiv('Drag: Rotate | Shift+Drag: Pan | Scroll: Zoom | Space: Reset View');
  instructions.position(10, 10);
  instructions.style('background-color', 'rgba(255, 255, 255, 0.7)');
  instructions.style('padding', '10px');
  instructions.style('border-radius', '5px');
  instructions.style('font-family', 'Arial, sans-serif');
}

function draw() {
  background(bgColor);
  
  // Apply inertia if not dragging
  if (!isDragging && (Math.abs(rotVelX) > inertiaThreshold || Math.abs(rotVelY) > inertiaThreshold)) {
    // Apply velocity to rotation
    rotX += rotVelX;
    rotY += rotVelY;
    
    // Constrain rotation on x-axis to prevent flipping
    rotX = constrain(rotX, -90, 90);
    
    // Apply damping to gradually reduce velocity
    rotVelX *= damping;
    rotVelY *= damping;
    
    // Stop rotation when velocity becomes too small
    if (Math.abs(rotVelX) < inertiaThreshold) rotVelX = 0;
    if (Math.abs(rotVelY) < inertiaThreshold) rotVelY = 0;
  }
  
  // Apply zoom
  scale(zoomLevel / 100);
  
  // Apply translation for panning
  translate(panX, panY, 0);
  
  // Apply rotation
  rotateX(rotX);
  rotateY(rotY);
  
  // Draw coordinate system axes for reference
  drawAxes();
  
  // Draw the lattice
  drawLattice();
}

function drawLattice() {
  // Get dimensions of the lattice
  const dimX = lattice.length;
  const dimY = lattice[0].length;
  const dimZ = lattice[0][0].length;
  
  // Calculate offsets to center the lattice
  const offsetX = -(dimX - 1) * spacing / 2;
  const offsetY = -(dimY - 1) * spacing / 2;
  const offsetZ = -(dimZ - 1) * spacing / 2;
  
  // First, draw all connections
  stroke(lineColor);
  strokeWeight(1);
  
  for (let x = 0; x < dimX; x++) {
    for (let y = 0; y < dimY; y++) {
      for (let z = 0; z < dimZ; z++) {
        const posX = offsetX + x * spacing;
        const posY = offsetY + y * spacing;
        const posZ = offsetZ + z * spacing;
        
        // Draw connecting lines if not at the edge
        if (x < dimX - 1) {
          line(posX, posY, posZ, posX + spacing, posY, posZ);
        }
        
        if (y < dimY - 1) {
          line(posX, posY, posZ, posX, posY + spacing, posZ);
        }
        
        if (z < dimZ - 1) {
          line(posX, posY, posZ, posX, posY, posZ + spacing);
        }
      }
    }
  }
  
  // Then, draw all nodes and text
  for (let x = 0; x < dimX; x++) {
    for (let y = 0; y < dimY; y++) {
      for (let z = 0; z < dimZ; z++) {
        const fraction = lattice[x][y][z];
        const posX = offsetX + x * spacing;
        const posY = offsetY + y * spacing;
        const posZ = offsetZ + z * spacing;
        
        // Calculate fraction value for size
        const fractionValue = fraction[0] / fraction[1];
        
        // Draw the fraction at its position
        drawFractionNode(posX, posY, posZ, fraction, fractionValue);
      }
    }
  }
}

function drawFractionNode(x, y, z, fraction, value) {
  push();
  translate(x, y, z);
  
  // Scale spheres based on fraction value (with limits)
  const size = map(constrain(value, 0.2, 4), 0.2, 4, minNodeSize, maxNodeSize);
  
  // Draw sphere with configured color
  noStroke();
  fill(sphereColor);
  sphere(size);
  
  // Draw fraction text - ensure it's always facing the camera
  push();
  // Reset the rotation to make the text face the camera
  rotateY(-rotY);
  rotateX(-rotX);
  
  // Draw shadow for better readability
  fill(textShadowColor);
  text(`${fraction[0]}/${fraction[1]}`, 0.5, -9.5, 0);
  
  // Draw text with configured color
  fill(textColor);
  text(`${fraction[0]}/${fraction[1]}`, 0, -10, 0);
  
  pop();
  pop();
}

function drawAxes() {
  // Draw x-axis
  stroke(xAxisColor);
  strokeWeight(2);
  line(0, 0, 0, spacing, 0, 0);
  push();
  translate(spacing, 0, 0);
  noStroke();
  pop();
  
  // Draw y-axis
  stroke(yAxisColor);
  line(0, 0, 0, 0, -1 * spacing, 0);
  push();
  translate(0, -1 * spacing, 0);
  noStroke();
  pop();
  
  // Draw z-axis
  stroke(zAxisColor);
  line(0, 0, 0, 0, 0, spacing);
  push();
  translate(0, 0, spacing);
  noStroke();
  pop();
}

function mousePressed() {
  // Start dragging
  isDragging = true;
  prevMouseX = mouseX;
  prevMouseY = mouseY;
  
  // Check if shift key is pressed for panning mode
  isPanning = keyIsDown(SHIFT);
  
  // Reset velocities when starting to drag if not panning
  if (!isPanning) {
    rotVelX = 0;
    rotVelY = 0;
  }
}

function mouseReleased() {
  // Stop dragging and let inertia take over
  isDragging = false;
  isPanning = false;
}

function mouseDragged() {
  if (isDragging) {
    // Calculate movement amount based on mouse movement
    const dx = mouseX - prevMouseX;
    const dy = mouseY - prevMouseY;
    
    // Check if shift is being held down (panning mode)
    isPanning = keyIsDown(SHIFT);
    
    if (isPanning) {
      // Pan the camera
      // Scale the panning based on zoom level for consistent feel
      const panScale = 100 / zoomLevel;
      panX += dx * panScale;
      panY += dy * panScale;
    } else {
      // Calculate velocity based on mouse movement
      rotVelY = dx * 0.2; // Scale down for smoother motion
      rotVelX = -dy * 0.2; // Inverted vertical control
      
      // Update rotation angles
      rotY += dx * 0.25;
      rotX -= dy * 0.25;  // Inverted vertical control
      
      // Limit rotation on x-axis to prevent flipping
      rotX = constrain(rotX, -90, 90);
    }
    
    // Update previous mouse position
    prevMouseX = mouseX;
    prevMouseY = mouseY;
  }
}

function mouseWheel(event) {
  // Calculate zoom target based on scroll direction
  const zoomTarget = zoomLevel - event.delta * 0.1;
  
  // Smoothly interpolate towards the target zoom
  zoomLevel = lerp(zoomLevel, zoomTarget, 0.5);
  
  // Constrain zoom level to reasonable values
  zoomLevel = constrain(zoomLevel, 100, 600);
  
  // Prevent default behavior (page scrolling)
  return false;
}

function keyPressed() {
  // Reset view when space is pressed
  if (keyCode === 32) {
    // Reset rotation and inertia
    rotX = 0;
    rotY = 0;
    rotVelX = 0;
    rotVelY = 0;
    
    // Reset zoom
    zoomLevel = 120;
    
    // Reset panning to origin
    panX = 0;
    panY = 0;
  }
}

function windowResized() {
  // Resize canvas when window size changes
  resizeCanvas(windowWidth, windowHeight);
}
